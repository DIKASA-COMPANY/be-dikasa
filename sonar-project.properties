# Project identity is passed from GitHub repository variables by the scan job.
sonar.projectName=DIKASA Backend
sonar.sourceEncoding=UTF-8

# Analyze application Go code; classify Go tests separately, including SQL migration tests.
sonar.sources=cmd,internal
sonar.tests=cmd,internal,migrations
sonar.exclusions=**/*_test.go
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage-sonar.out
