name: Deploy immutable backend release

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      release_run_id:
        required: true
        type: string
      rollback:
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  deployments: write
  packages: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require deployment activation
        env:
          DEPLOY_ENABLED: ${{ vars.KOYEB_DEPLOY_ENABLED }}
        run: test "$DEPLOY_ENABLED" = true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate selected release run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          TARGET_ENV: ${{ inputs.environment }}
        run: python3 scripts/cicd/release.py check-run

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.cloud.outputs.service_url }}
    concurrency:
      group: backend-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      TARGET_ENV: ${{ inputs.environment }}
      ROLLBACK: ${{ inputs.rollback }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: backend-release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      # Check after acquiring the environment lock so parallel promotions cannot race.
      - name: Enforce release provenance and environment order
        id: gate
        run: python3 scripts/cicd/release.py gate
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Migrate, deploy to Koyeb and verify
        id: cloud
        env:
          RELEASE_IMAGE: ${{ steps.gate.outputs.image }}
          KOYEB_SERVICE_ID: ${{ vars.KOYEB_SERVICE_ID }}
          SMOKE_URL: ${{ vars.KOYEB_SERVICE_URL }}
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python3 scripts/cicd/koyeb.py
      - name: Record successful promotion
        env:
          SERVICE_URL: ${{ steps.cloud.outputs.service_url }}
        run: python3 scripts/cicd/release.py record
      - name: Summarize deployment
        env:
          RELEASE_IMAGE: ${{ steps.gate.outputs.image }}
          SERVICE_URL: ${{ steps.cloud.outputs.service_url }}
        run: |
          printf 'Environment: `%s`\n\nImage: `%s`\n\nURL: %s\n' \
            "$TARGET_ENV" "$RELEASE_IMAGE" "$SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"
