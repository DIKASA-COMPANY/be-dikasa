components:
  schemas:
    Body:
      additionalProperties: false
      properties:
        code:
          type: string
        details:
          additionalProperties:
            type: string
          type: object
        message:
          type: string
      required:
        - code
        - message
      type: object
    CategoriesOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/CategoryData"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    CategoryData:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        is_active:
          type: boolean
        name:
          type: string
        sort_order:
          format: int64
          type: integer
      required:
        - id
        - name
        - sort_order
        - is_active
      type: object
    CategoryOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/CategoryData"
      required:
        - data
      type: object
    CategoryRequest:
      additionalProperties: false
      properties:
        is_active:
          type: boolean
        name:
          type: string
        sort_order:
          format: int64
          type: integer
      required:
        - name
        - sort_order
        - is_active
      type: object
    ChangePINRequest:
      additionalProperties: false
      properties:
        current_pin:
          maxLength: 6
          minLength: 6
          pattern: ^[0-9]{6}$
          type: string
        new_pin:
          maxLength: 6
          minLength: 6
          pattern: ^[0-9]{6}$
          type: string
        new_pin_confirmation:
          maxLength: 6
          minLength: 6
          pattern: ^[0-9]{6}$
          type: string
      required:
        - new_pin
        - new_pin_confirmation
      type: object
    ChangePasswordRequest:
      additionalProperties: false
      properties:
        current_password:
          maxLength: 72
          minLength: 8
          type: string
        new_password:
          maxLength: 72
          minLength: 8
          type: string
        new_password_confirmation:
          maxLength: 72
          minLength: 8
          type: string
      required:
        - current_password
        - new_password
        - new_password_confirmation
      type: object
    ConfirmOTPRequest:
      additionalProperties: false
      properties:
        email:
          examples:
            - budi@example.com
          format: email
          maxLength: 254
          type: string
        otp:
          examples:
            - "12345"
          maxLength: 5
          minLength: 5
          pattern: ^[0-9]{5}$
          type: string
      required:
        - email
        - otp
      type: object
    ConfirmOTPResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ConfirmOTPResponseData"
      required:
        - data
      type: object
    ConfirmOTPResponseData:
      additionalProperties: false
      properties:
        verified:
          examples:
            - true
          type: boolean
      required:
        - verified
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        service:
          examples:
            - be-dikasa
          type: string
        status:
          examples:
            - ok
          type: string
      required:
        - status
        - service
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        identifier:
          description: Username, nomor HP, atau email user PostgreSQL
          examples:
            - kasir
          maxLength: 254
          minLength: 3
          type: string
        password:
          description: Password user PostgreSQL
          maxLength: 128
          minLength: 8
          type: string
      required:
        - identifier
        - password
      type: object
    LoginResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/LoginResponseData"
      required:
        - data
      type: object
    LoginResponseData:
      additionalProperties: false
      properties:
        access_token:
          description: Firebase ID token untuk Authorization Bearer
          type: string
        expires_in:
          examples:
            - 3600
          format: int64
          type: integer
        firebase_uid:
          description: Sama dengan UUID user PostgreSQL
          type: string
        refresh_token:
          description: Firebase refresh token untuk memperbarui sesi
          type: string
        token_type:
          enum:
            - Bearer
          examples:
            - Bearer
          type: string
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - firebase_uid
      type: object
    MetaStruct:
      additionalProperties: false
      properties:
        page:
          format: int64
          type: integer
        page_size:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - page
        - page_size
        - total
      type: object
    OTPResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/OTPResponseData"
      required:
        - data
      type: object
    OTPResponseData:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        otp_expires_in:
          examples:
            - 300
          format: int64
          type: integer
        resend_available_in:
          examples:
            - 60
          format: int64
          type: integer
      required:
        - email
        - otp_expires_in
        - resend_available_in
      type: object
    OpenRequest:
      additionalProperties: false
      properties:
        opening_cash:
          examples:
            - 500000
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
      required:
        - opening_cash
      type: object
    OrderTypeData:
      additionalProperties: false
      properties:
        code:
          type: string
        icon_key:
          type: string
        id:
          format: uuid
          type: string
        is_active:
          type: boolean
        name:
          type: string
        sort_order:
          format: int64
          type: integer
      required:
        - id
        - code
        - name
        - sort_order
        - is_active
      type: object
    OrderTypeOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/OrderTypeData"
      required:
        - data
      type: object
    OrderTypeRequest:
      additionalProperties: false
      properties:
        code:
          type: string
        icon_key:
          type: string
        is_active:
          type: boolean
        name:
          type: string
        sort_order:
          format: int64
          type: integer
      required:
        - code
        - name
        - sort_order
        - is_active
      type: object
    OrderTypesOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/OrderTypeData"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    ProductData:
      additionalProperties: false
      properties:
        category:
          $ref: "#/components/schemas/CategoryData"
        cost_price:
          format: int64
          minimum: 0
          type: integer
        description:
          type: string
        id:
          format: uuid
          type: string
        image_url:
          format: uri
          type: string
        is_active:
          type: boolean
        is_highlighted:
          type: boolean
        name:
          type: string
        online_cost_price:
          format: int64
          minimum: 0
          type: integer
        online_selling_price:
          format: int64
          minimum: 0
          type: integer
        price:
          format: int64
          minimum: 0
          type: integer
        product_type:
          enum:
            - food
            - drink
            - additional
          type: string
        selling_price:
          format: int64
          minimum: 0
          type: integer
        sort_order:
          format: int64
          type: integer
        stock_status:
          enum:
            - available
            - out_of_stock
          type: string
        variations:
          items:
            $ref: "#/components/schemas/ProductVariantData"
          type:
            - array
            - "null"
      required:
        - id
        - name
        - price
        - selling_price
        - stock_status
        - description
        - is_highlighted
        - sort_order
        - is_active
        - category
        - product_type
        - variations
      type: object
    ProductOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ProductData"
      required:
        - data
      type: object
    ProductTypeData:
      additionalProperties: false
      properties:
        code:
          enum:
            - food
            - drink
            - additional
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        sort_order:
          format: int64
          type: integer
      required:
        - id
        - code
        - name
        - sort_order
      type: object
    ProductTypesOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/ProductTypeData"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    ProductVariantData:
      additionalProperties: false
      properties:
        cost_price:
          format: int64
          minimum: 0
          type: integer
        id:
          format: uuid
          type: string
        is_active:
          type: boolean
        name:
          type: string
        online_cost_price:
          format: int64
          minimum: 0
          type: integer
        online_selling_price:
          format: int64
          minimum: 0
          type: integer
        selling_price:
          format: int64
          minimum: 0
          type: integer
        sort_order:
          format: int64
          type: integer
        stock_status:
          enum:
            - available
            - out_of_stock
          type: string
      required:
        - id
        - name
        - selling_price
        - stock_status
        - sort_order
        - is_active
      type: object
    ProductVariantRequest:
      additionalProperties: false
      properties:
        cost_price:
          format: int64
          minimum: 0
          type: integer
        name:
          maxLength: 100
          type: string
        online_cost_price:
          format: int64
          minimum: 0
          type: integer
        online_selling_price:
          format: int64
          minimum: 0
          type: integer
        selling_price:
          format: int64
          minimum: 0
          type: integer
        sort_order:
          format: int64
          type: integer
        stock_status:
          enum:
            - available
            - out_of_stock
          type: string
      required:
        - name
        - selling_price
        - stock_status
        - sort_order
      type: object
    ProductsOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/ProductData"
          type:
            - array
            - "null"
        meta:
          $ref: "#/components/schemas/MetaStruct"
      required:
        - data
        - meta
      type: object
    Profile:
      additionalProperties: false
      properties:
        avatar_url:
          format: uri
          type: string
        email:
          type: string
        first_name:
          type: string
        gender_id:
          type: string
        id:
          type: string
        is_active:
          type: boolean
        last_name:
          type: string
        outlet_id:
          type: string
        phone_number:
          type: string
        role_id:
          type: string
        username:
          type: string
      required:
        - id
        - role_id
        - username
        - phone_number
        - first_name
        - last_name
        - is_active
      type: object
    ProfileResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Profile"
      required:
        - data
      type: object
    RegisterRequest:
      additionalProperties: false
      properties:
        business_address:
          examples:
            - Jl. Merdeka No. 10
          maxLength: 1000
          minLength: 5
          type: string
        business_email:
          examples:
            - owner@warung.example
          format: email
          maxLength: 254
          type: string
        business_name:
          examples:
            - Warung Dikasa
          maxLength: 120
          minLength: 2
          type: string
        business_phone:
          examples:
            - "081234567890"
          maxLength: 30
          minLength: 8
          type: string
        owner_date_of_birth:
          examples:
            - "1990-01-02"
          format: date
          type: string
        owner_email:
          examples:
            - budi@example.com
          format: email
          maxLength: 254
          type: string
        owner_name:
          examples:
            - Budi Santoso
          maxLength: 200
          minLength: 2
          type: string
        owner_phone:
          examples:
            - "081298765432"
          maxLength: 30
          minLength: 8
          type: string
        password:
          maxLength: 72
          minLength: 8
          type: string
        password_confirmation:
          maxLength: 72
          minLength: 8
          type: string
        username:
          examples:
            - budisantoso
          maxLength: 50
          minLength: 3
          pattern: ^[A-Za-z0-9]+$
          type: string
        verification_email:
          examples:
            - budi@example.com
          format: email
          maxLength: 254
          type: string
      required:
        - business_name
        - business_address
        - business_phone
        - owner_name
        - owner_date_of_birth
        - owner_phone
        - owner_email
        - username
        - password
        - password_confirmation
        - verification_email
      type: object
    ResendOTPRequest:
      additionalProperties: false
      properties:
        email:
          examples:
            - budi@example.com
          format: email
          maxLength: 254
          type: string
      required:
        - email
      type: object
    ReservationData:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        created_by:
          format: uuid
          type: string
        customer_contact:
          type: string
        customer_name:
          type: string
        id:
          format: uuid
          type: string
        notes:
          type: string
        print_reservation:
          type: boolean
        reservation_type:
          $ref: "#/components/schemas/TypeData"
        reserved_at:
          format: date-time
          type: string
        restaurant_table:
          $ref: "#/components/schemas/TableData"
        send_reservation:
          type: boolean
        status:
          enum:
            - booked
            - confirmed
            - seated
            - completed
            - cancelled
          type: string
        updated_at:
