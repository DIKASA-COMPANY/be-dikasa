components:
  schemas:
    ActivityData:
      additionalProperties: false
      properties:
        capabilities:
          $ref: "#/components/schemas/MovementCapabilities"
        events:
          items:
            $ref: "#/components/schemas/CashActivityEvent"
          type:
            - array
            - "null"
        session:
          $ref: "#/components/schemas/SessionRecord"
        totals:
          $ref: "#/components/schemas/CashFlowTotals"
      required:
        - session
        - totals
        - capabilities
        - events
      type: object
    ActivityMeta:
      additionalProperties: false
      properties:
        page:
          format: int64
          type: integer
        page_size:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - page
        - page_size
        - total
      type: object
    ActivityPage:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ActivityData"
        meta:
          $ref: "#/components/schemas/ActivityMeta"
      required:
        - data
        - meta
      type: object
    Body:
      additionalProperties: false
      properties:
        code:
          type: string
        details:
          additionalProperties:
            type: string
          type: object
        message:
          type: string
      required:
        - code
        - message
      type: object
    CashActivityEvent:
      additionalProperties: false
      properties:
        amount:
          format: int64
          type: integer
        created_by:
          type: string
        created_by_name:
          type: string
        direction:
          type: string
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        occurred_at:
          format: date-time
          type: string
        reason:
          type: string
        reverses_id:
          type:
            - string
            - "null"
        source_id:
          type: string
      required:
        - id
        - source_id
        - kind
        - direction
        - amount
        - name
        - reason
        - occurred_at
        - created_by
        - created_by_name
        - reverses_id
      type: object
    CashCloseOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ClosedReconciliation"
      required:
        - data
      type: object
    CashDetailOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/SessionRecord"
      required:
        - data
      type: object
    CashFlowTotals:
      additionalProperties: false
      properties:
        cash_in:
          format: int64
          type: integer
        cash_out:
          format: int64
          type: integer
        cash_refunds:
          format: int64
          type: integer
        cash_sales:
          format: int64
          type: integer
        expected_cash:
          format: int64
          type: integer
        movement_count:
          format: int64
          type: integer
        opening:
          format: int64
          type: integer
        total_in:
          format: int64
          type: integer
        total_out:
          format: int64
          type: integer
      required:
        - opening
        - cash_sales
        - cash_refunds
        - cash_in
        - cash_out
        - total_in
        - total_out
        - expected_cash
        - movement_count
      type: object
    CashPreviewOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ClosePreview"
      required:
        - data
      type: object
    CashSessionsOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/SessionRecord"
          type:
            - array
            - "null"
        meta:
          $ref: "#/components/schemas/MetaStruct"
      required:
        - data
        - meta
      type: object
    CategoriesOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/CategoryData"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    CategoryData:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        is_active:
          type: boolean
        name:
          type: string
        sort_order:
          format: int64
          type: integer
      required:
        - id
        - name
        - sort_order
        - is_active
      type: object
    CategoryOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/CategoryData"
      required:
        - data
      type: object
    CategoryRequest:
      additionalProperties: false
      properties:
        is_active:
          type: boolean
        name:
          type: string
        sort_order:
          format: int64
          type: integer
      required:
        - name
        - sort_order
        - is_active
      type: object
    ChangePINRequest:
      additionalProperties: false
      properties:
        current_pin:
          maxLength: 6
          minLength: 6
          pattern: ^[0-9]{6}$
          type: string
        new_pin:
          maxLength: 6
          minLength: 6
          pattern: ^[0-9]{6}$
          type: string
        new_pin_confirmation:
          maxLength: 6
          minLength: 6
          pattern: ^[0-9]{6}$
          type: string
      required:
        - new_pin
        - new_pin_confirmation
      type: object
    ChangePasswordRequest:
      additionalProperties: false
      properties:
        current_password:
          description: Panjang 8–72 byte UTF-8; divalidasi service.
          maxLength: 72
          minLength: 1
          type: string
        new_password:
          description: Panjang 8–72 byte UTF-8; divalidasi service.
          maxLength: 72
          minLength: 1
          type: string
        new_password_confirmation:
          maxLength: 72
          minLength: 1
          type: string
      required:
        - current_password
        - new_password
        - new_password_confirmation
      type: object
    CloseCommand:
      additionalProperties: false
      properties:
        counted_cash:
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
        preview_hash:
          maxLength: 64
          minLength: 64
          type: string
        reason:
          maxLength: 500
          type: string
        request_id:
          format: uuid
          type: string
      required:
        - request_id
        - preview_hash
        - counted_cash
        - reason
      type: object
    ClosePreview:
      additionalProperties: false
      properties:
        counted_cash:
          format: int64
          type: integer
        difference:
          format: int64
          type: integer
        preview_hash:
          type: string
        reason:
          type: string
        summary:
          $ref: "#/components/schemas/ReconciliationSummary"
      required:
        - summary
        - counted_cash
        - difference
        - reason
        - preview_hash
      type: object
    CloseSelection:
      additionalProperties: false
      properties:
        counted_cash:
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
        reason:
          maxLength: 500
          type: string
      required:
        - counted_cash
        - reason
      type: object
    ClosedReconciliation:
      additionalProperties: false
      properties:
        close_request_id:
          type: string
        closed_at:
          format: date-time
          type: string
        closed_by:
          type: string
        closed_by_name:
          type: string
        counted_cash:
          format: int64
          type: integer
        difference:
          format: int64
          type: integer
        preview_hash:
          type: string
        reason:
          type: string
        session_id:
          type: string
        summary:
          $ref: "#/components/schemas/ReconciliationSummary"
      required:
        - session_id
        - closed_by
        - closed_by_name
        - closed_at
        - close_request_id
        - summary
        - counted_cash
        - difference
        - reason
        - preview_hash
      type: object
    Command:
      additionalProperties: false
      properties:
        expected_refund_revision:
          format: int64
          minimum: 0
          type: integer
        items:
          items:
            $ref: "#/components/schemas/SelectedItem"
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
        method:
          enum:
            - cash
            - wallet
            - debit_card
            - qris
            - transfer
          type: string
        mode:
          enum:
            - full
            - items
          type: string
        preview_hash:
          maxLength: 64
          minLength: 64
          type: string
        reason:
          maxLength: 500
          minLength: 1
          type: string
        request_id:
          format: uuid
          type: string
      required:
        - request_id
        - preview_hash
        - mode
        - method
        - reason
        - expected_refund_revision
        - items
      type: object
    ConfirmOTPRequest:
      additionalProperties: false
      properties:
        email:
          examples:
            - budi@example.com
          format: email
          maxLength: 254
          type: string
        otp:
          examples:
            - "12345"
          maxLength: 5
          minLength: 5
          pattern: ^[0-9]{5}$
          type: string
      required:
        - email
        - otp
      type: object
    ConfirmOTPResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ConfirmOTPResponseData"
      required:
        - data
      type: object
    ConfirmOTPResponseData:
      additionalProperties: false
      properties:
        verified:
          examples:
            - true
          type: boolean
      required:
        - verified
      type: object
    CustomerData:
      additionalProperties: false
      properties:
        address:
          type: string
        created_at:
          format: date-time
          type: string
        email:
          format: email
          type: string
        gender:
          $ref: "#/components/schemas/GenderData"
        id:
          format: uuid
          type: string
        name:
          type: string
        phone_number:
          type: string
        points:
          format: int64
          minimum: 0
          type: integer
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - address
        - points
        - phone_number
        - created_at
        - updated_at
      type: object
    CustomersOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/CustomerData"
          type:
            - array
            - "null"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - meta
      type: object
    DailyPoint:
      additionalProperties: false
      properties:
        charged_sales:
          format: int64
          type: integer
        date:
          type: string
        net_sales:
          format: int64
          type: integer
        refund_amount:
          format: int64
          type: integer
        sale_count:
          format: int64
          type: integer
      required:
        - date
        - sale_count
        - charged_sales
        - refund_amount
        - net_sales
      type: object
    DetailOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ReceiptSnapshot"
      required:
        - data
      type: object
    GenderChoice:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    GenderData:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    GenderOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/GenderChoice"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    GroupRow:
      additionalProperties: false
      properties:
        average_transaction:
          format: int64
          type:
            - integer
            - "null"
        category_id:
          type: string
        category_name:
          type: string
        charged_sales:
          format: int64
          type: integer
        discount_amount:
          format: int64
          type: integer
        excluded_receipts:
          format: int64
          type: integer
        gross_sales:
          format: int64
          type: integer
        key:
          type: string
        name:
          type: string
        net_quantity:
          format: int64
          type: integer
        net_sales:
          format: int64
          type: integer
        net_tax:
          format: int64
          type: integer
        product_id:
          type: string
        refund_amount:
          format: int64
          type: integer
        refund_count:
          format: int64
          type: integer
        refund_net:
          format: int64
          type: integer
        refund_tax:
          format: int64
          type: integer
        returned_quantity:
          format: int64
          type: integer
        sale_count:
          format: int64
          type: integer
        sale_tax:
          format: int64
          type: integer
        sales_after_discount:
          format: int64
          type: integer
        sold_quantity:
          format: int64
          type: integer
        unit_price_max:
          format: int64
          type:
            - integer
            - "null"
        unit_price_min:
          format: int64
          type:
            - integer
            - "null"
        unknown_category_quantity:
          format: int64
          type: integer
        value_after_refunds:
          format: int64
          type: integer
        variant_id:
          type: string
      required:
        - key
        - name
        - unit_price_min
        - unit_price_max
        - gross_sales
        - discount_amount
        - sales_after_discount
        - charged_sales
        - refund_net
        - refund_tax
        - refund_amount
        - net_sales
        - sale_tax
        - net_tax
        - value_after_refunds
        - sale_count
        - refund_count
        - sold_quantity
        - returned_quantity
        - net_quantity
        - average_transaction
        - excluded_receipts
        - unknown_category_quantity
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        service:
          examples:
            - be-dikasa
          type: string
        status:
          examples:
            - ok
          type: string
      required:
        - status
        - service
      type: object
    HistoryOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/Refund"
          type:
            - array
            - "null"
        meta:
          $ref: "#/components/schemas/MetaStruct"
      required:
        - data
        - meta
      type: object
    Item:
      additionalProperties: false
      properties:
        notes:
          maxLength: 500
          type: string
        position:
          format: int64
          type: integer
        product_id:
          format: uuid
          type: string
        product_name:
          maxLength: 150
          type: string
        product_variant_id:
          format: uuid
          type: string
        quantity:
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
        unit_price:
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
        variant_name:
          maxLength: 100
          type: string
      required:
        - product_id
        - product_name
        - unit_price
        - quantity
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/Order"
          type:
            - array
            - "null"
        meta:
          $ref: "#/components/schemas/MetaStruct"
      required:
        - data
        - meta
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        identifier:
          description: Username, nomor HP, atau email user PostgreSQL
          examples:
            - kasir
          maxLength: 254
          minLength: 3
          type: string
        password:
          description: Password user PostgreSQL
          maxLength: 128
          minLength: 8
          type: string
      required:
        - identifier
        - password
      type: object
    LoginResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/LoginResponseData"
      required:
        - data
      type: object
    LoginResponseData:
      additionalProperties: false
      properties:
        access_token:
          description: Firebase ID token untuk Authorization Bearer
          type: string
        expires_in:
          examples:
            - 3600
          format: int64
          type: integer
        firebase_uid:
          description: UUID user PostgreSQL yang dipakai sebagai Firebase UID
          type: string
        refresh_token:
          description: Firebase refresh token
          type: string
        token_type:
          enum:
            - Bearer
          examples:
            - Bearer
          type: string
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - firebase_uid
      type: object
    Meta:
      additionalProperties: false
      properties:
        end_date:
          type: string
        generated_at:
          format: date-time
          type: string
        page:
          format: int64
          type: integer
        page_size:
          format: int64
          type: integer
        query:
          type: string
        sort:
          type: string
        start_date:
          type: string
        timezone:
          type: string
        total:
          format: int64
          type: integer
      required:
        - query
        - sort
        - start_date
        - end_date
        - timezone
        - generated_at
        - page
        - page_size
        - total
      type: object
    MetaStruct:
      additionalProperties: false
      properties:
        page:
          format: int64
          type: integer
        page_size:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - page
        - page_size
        - total
      type: object
    MethodRow:
      additionalProperties: false
      properties:
        method:
          type: string
        net_amount:
          format: int64
          type: integer
        refund_amount:
          format: int64
          type: integer
        refund_count:
          format: int64
          type: integer
        sale_count:
          format: int64
          type: integer
        sales_amount:
          format: int64
          type: integer
      required:
        - method
        - sale_count
        - sales_amount
        - refund_count
        - refund_amount
        - net_amount
      type: object
    MethodSummary:
      additionalProperties: false
      properties:
        method:
          type: string
        refund_count:
          format: int64
          type: integer
        refunds_amount:
          format: int64
          type: integer
        sale_count:
          format: int64
          type: integer
        sales_amount:
          format: int64
          type: integer
      required:
        - method
        - sale_count
        - sales_amount
        - refund_count
        - refunds_amount
      type: object
    MovementCapabilities:
      additionalProperties: false
      properties:
        can_create:
          type: boolean
        can_upload_proof:
          type: boolean
      required:
        - can_create
        - can_upload_proof
      type: object
    MovementDetail:
      additionalProperties: false
      properties:
        can_reverse:
          type: boolean
        movement:
          $ref: "#/components/schemas/MovementRecord"
        reversed_by_id:
          type:
            - string
            - "null"
      required:
        - movement
        - can_reverse
        - reversed_by_id
      type: object
    MovementDetailOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/MovementDetail"
      required:
        - data
      type: object
    MovementOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/MovementRecord"
      required:
        - data
      type: object
    MovementProofOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ProofLink"
      required:
        - data
      type: object
    MovementRecord:
      additionalProperties: false
      properties:
        amount:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        created_by_name:
          type: string
        has_proof:
          type: boolean
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        outlet_id:
          type: string
        reason:
          type: string
        request_id:
          type: string
        reverses_id:
          type:
            - string
            - "null"
        session_id:
          type: string
      required:
        - id
        - outlet_id
        - session_id
        - request_id
        - created_by
        - created_by_name
        - created_at
        - kind
        - amount
        - name
        - reason
        - reverses_id
        - has_proof
      type: object
    Mutation:
      additionalProperties: false
      properties:
        expected_revision:
          format: int64
          minimum: 0
          type: integer
        items:
          items:
            $ref: "#/components/schemas/Item"
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
        label:
          maxLength: 100
          type: string
        order_type_id:
          format: uuid
          type: string
        request_id:
          format: uuid
          type: string
      required:
        - request_id
        - label
        - order_type_id
        - items
      type: object
    OTPResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/OTPResponseData"
      required:
        - data
      type: object
    OTPResponseData:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        otp_expires_in:
          examples:
            - 300
          format: int64
          type: integer
        resend_available_in:
          examples:
            - 60
          format: int64
          type: integer
      required:
        - email
        - otp_expires_in
        - resend_available_in
      type: object
    OpenRequest:
      additionalProperties: false
      properties:
        opening_cash:
          examples:
            - 500000
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
      required:
        - opening_cash
      type: object
    Order:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        creator_name:
          type: string
        estimated_subtotal:
          format: int64
          type: integer
        id:
          type: string
        items:
          items:
            $ref: "#/components/schemas/Item"
          type:
            - array
            - "null"
        label:
          type: string
        order_type_id:
          type: string
        revision:
          format: int64
          type: integer
        status:
          type: string
        total_quantity:
          format: int64
          type: integer
        transaction_id:
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - created_by
        - creator_name
        - label
        - order_type_id
        - revision
        - status
        - transaction_id
        - created_at
        - updated_at
        - items
        - estimated_subtotal
        - total_quantity
      type: object
    OrderData:
      additionalProperties: false
      properties:
        customer_id:
          format: uuid
          type: string
        customer_name:
          type: string
        id:
          format: uuid
          type: string
        net_after_refund:
          format: int64
          type:
            - integer
            - "null"
        order_type:
          $ref: "#/components/schemas/OrderListTypeData"
        ordered_at:
          format: date-time
          type: string
        receipt_number:
          type: string
        refund_revision:
          format: int64
          type: integer
        refunded_amount:
          format: int64
          type:
            - integer
            - "null"
        refunds_supported:
          type: boolean
        restaurant_table:
          $ref: "#/components/schemas/RestaurantTableData"
        status:
          enum:
            - paid
            - partially_refunded
            - refunded
            - cancelled
          type: string
        total_amount:
          format: int64
          minimum: 0
          type: integer
        total_quantity:
          format: int64
          minimum: 1
          type: integer
      required:
        - refunded_amount
        - net_after_refund
        - refund_revision
        - refunds_supported
        - id
        - receipt_number
        - customer_name
        - ordered_at
        - order_type
        - total_quantity
        - total_amount
        - status
