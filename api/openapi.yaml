    TypesOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/TypeData"
          type:
            - array
            - "null"
      required:
        - data
      type: object
  securitySchemes:
    firebaseBearer:
      bearerFormat: Firebase ID token
      description: Gunakan access_token Firebase dari endpoint /login.
      scheme: bearer
      type: http
info:
  title: API Dikasa
  version: 1.0.0
openapi: 3.1.0
paths:
  /cash-sessions:
    post:
      description: Mencatat kas awal Rupiah untuk membuka satu sesi kas pada outlet user. Hanya satu sesi boleh aktif per outlet.
      operationId: open-cash-session
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Akses ditolak.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi konflik data.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
      summary: Membuka sesi kas
      tags:
        - Sesi Kas
  /cash-sessions/current:
    get:
      description: Mengambil sesi kas yang sedang aktif pada outlet user terautentikasi.
      operationId: get-current-cash-session
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Akses ditolak.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Data tidak ditemukan.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
      summary: Mengambil sesi kas aktif
      tags:
        - Sesi Kas
  /health:
    get:
      description: Memastikan API berjalan dan Firebase ID token berhasil diverifikasi.
      operationId: get-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
      summary: Memeriksa kondisi API
      tags:
        - Sistem
  /login:
    post:
      description: Memvalidasi username, nomor HP, atau email dan password di PostgreSQL, lalu meminta Firebase menerbitkan token.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Permintaan tidak valid.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Akses ditolak.
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Tipe konten tidak didukung.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Layanan eksternal bermasalah.
      security: []
      summary: Masuk ke aplikasi
      tags:
        - Autentikasi
  /order-types:
    get:
      operationId: list-order-types
      parameters:
        - explode: false
          in: query
          name: include_inactive
          schema:
            default: false
            type: boolean
