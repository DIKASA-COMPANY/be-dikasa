          type: string
      required:
        - id
        - customer_name
        - customer_contact
        - reserved_at
        - notes
        - print_reservation
        - send_reservation
        - status
        - reservation_type
        - restaurant_table
        - created_by
        - created_at
        - updated_at
      type: object
    ReservationOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ReservationData"
      required:
        - data
      type: object
    ReservationPatchRequest:
      additionalProperties: false
      properties:
        customer_contact:
          type: string
        customer_name:
          type: string
        notes:
          maxLength: 1000
          type: string
        print_reservation:
