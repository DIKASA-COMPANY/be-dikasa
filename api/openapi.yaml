components:
  schemas:
    Body:
      additionalProperties: false
      properties:
        code:
          type: string
        details:
          additionalProperties:
            type: string
          type: object
        message:
          type: string
      required:
        - code
        - message
      type: object
    ConfirmOTPRequest:
      additionalProperties: false
      properties:
        email:
          examples:
            - budi@example.com
          format: email
          maxLength: 254
          type: string
        otp:
          examples:
            - "12345"
          maxLength: 5
          minLength: 5
          pattern: ^[0-9]{5}$
          type: string
      required:
        - email
        - otp
      type: object
    ConfirmOTPResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ConfirmOTPResponseData"
      required:
        - data
      type: object
    ConfirmOTPResponseData:
      additionalProperties: false
      properties:
        verified:
          examples:
            - true
          type: boolean
      required:
        - verified
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        service:
          examples:
            - be-dikasa
          type: string
        status:
          examples:
            - ok
          type: string
      required:
        - status
        - service
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        identifier:
          description: Username, nomor HP, atau email user PostgreSQL
          examples:
            - kasir
          maxLength: 254
          minLength: 3
          type: string
        password:
          description: Password user PostgreSQL
          maxLength: 128
          minLength: 8
          type: string
      required:
        - identifier
        - password
      type: object
    LoginResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/LoginResponseData"
      required:
        - data
      type: object
    LoginResponseData:
      additionalProperties: false
      properties:
        access_token:
          description: Firebase ID token untuk Authorization Bearer
          type: string
        expires_in:
          examples:
            - 3600
          format: int64
          type: integer
        firebase_uid:
          description: Sama dengan UUID user PostgreSQL
          type: string
        refresh_token:
          description: Firebase refresh token untuk memperbarui sesi
          type: string
        token_type:
          enum:
            - Bearer
          examples:
            - Bearer
          type: string
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - firebase_uid
      type: object
    OTPResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/OTPResponseData"
      required:
        - data
      type: object
    OTPResponseData:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        otp_expires_in:
          examples:
            - 300
          format: int64
          type: integer
        resend_available_in:
          examples:
            - 60
          format: int64
          type: integer
      required:
        - email
        - otp_expires_in
        - resend_available_in
      type: object
    Profile:
      additionalProperties: false
      properties:
        email:
          type: string
        first_name:
          type: string
        gender_id:
          type: string
        id:
          type: string
        is_active:
          type: boolean
        last_name:
          type: string
        outlet_id:
          type: string
        phone_number:
          type: string
        role_id:
          type: string
        username:
          type: string
      required:
        - id
        - role_id
        - username
        - phone_number
        - first_name
        - last_name
        - is_active
      type: object
    ProfileResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Profile"
      required:
        - data
      type: object
    RegisterRequest:
      additionalProperties: false
      properties:
        business_address:
          examples:
            - Jl. Merdeka No. 10
          maxLength: 1000
          minLength: 5
          type: string
        business_email:
          examples:
            - owner@warung.example
          format: email
          maxLength: 254
          type: string
        business_name:
          examples:
            - Warung Dikasa
          maxLength: 120
          minLength: 2
          type: string
        business_phone:
          examples:
            - "081234567890"
          maxLength: 30
          minLength: 8
          type: string
        owner_date_of_birth:
          examples:
            - "1990-01-02"
          format: date
          type: string
        owner_email:
          examples:
            - budi@example.com
          format: email
          maxLength: 254
          type: string
        owner_name:
          examples:
            - Budi Santoso
          maxLength: 200
          minLength: 2
          type: string
        owner_phone:
          examples:
            - "081298765432"
          maxLength: 30
          minLength: 8
          type: string
        password:
          maxLength: 72
          minLength: 8
          type: string
        password_confirmation:
          maxLength: 72
          minLength: 8
          type: string
        username:
          examples:
            - budisantoso
          maxLength: 50
          minLength: 3
          pattern: ^[A-Za-z0-9]+$
          type: string
        verification_email:
          examples:
            - budi@example.com
          format: email
          maxLength: 254
          type: string
      required:
        - business_name
        - business_address
        - business_phone
        - owner_name
        - owner_date_of_birth
        - owner_phone
        - owner_email
        - username
        - password
        - password_confirmation
        - verification_email
      type: object
    ResendOTPRequest:
      additionalProperties: false
      properties:
        email:
          examples:
            - budi@example.com
          format: email
          maxLength: 254
          type: string
      required:
        - email
      type: object
    StatusError:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/Body"
      required:
        - error
      type: object
  securitySchemes:
    firebaseBearer:
      bearerFormat: Firebase ID token
      description: Gunakan access_token Firebase dari endpoint /login.
      scheme: bearer
      type: http
info:
  title: API Dikasa
  version: 1.0.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Memastikan API berjalan dan Firebase ID token berhasil diverifikasi.
      operationId: get-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
      summary: Memeriksa kondisi API
      tags:
        - Sistem
  /login:
    post:
      description: Memvalidasi username, nomor HP, atau email dan password di PostgreSQL, lalu meminta Firebase menerbitkan token.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Permintaan tidak valid.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Akses ditolak.
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Tipe konten tidak didukung.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Layanan eksternal bermasalah.
      security: []
      summary: Masuk ke aplikasi
      tags:
        - Autentikasi
  /register:
    post:
      description: Membuat outlet dan akun nonaktif, lalu mengirim OTP lima digit ke email verifikasi yang dipilih.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTPResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Permintaan tidak valid.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi konflik data.
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Tipe konten tidak didukung.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Layanan eksternal bermasalah.
      security: []
      summary: Mendaftarkan usaha dan akun pemilik
      tags:
        - Registrasi
  /register/otp/confirm:
    post:
      description: Memverifikasi OTP sekali pakai lalu mengaktifkan akun pemilik dan outlet.
      operationId: confirm-registration-otp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmOTPRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmOTPResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Permintaan tidak valid.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi konflik data.
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Data sudah kedaluwarsa.
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Tipe konten tidak didukung.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terlalu banyak permintaan.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
      security: []
      summary: Mengonfirmasi OTP registrasi
      tags:
        - Registrasi
  /register/otp/resend:
    post:
      description: Mengganti OTP sebelumnya dan mengirim kode baru setelah cooldown selesai.
      operationId: resend-registration-otp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendOTPRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTPResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Permintaan tidak valid.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Data tidak ditemukan.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi konflik data.
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Tipe konten tidak didukung.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terlalu banyak permintaan.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Layanan eksternal bermasalah.
      security: []
      summary: Mengirim ulang OTP registrasi
      tags:
        - Registrasi
  /users/me:
    get:
      description: Mengambil profil PostgreSQL berdasarkan UID pada Firebase ID token.
      operationId: get-current-user
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Data tidak ditemukan.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
      summary: Mengambil profil user aktif
      tags:
        - User
security:
  - firebaseBearer: []
servers:
  - description: API Dikasa
    url: /dikasa/v1
