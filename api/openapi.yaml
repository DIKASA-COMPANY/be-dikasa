          description: Data tidak ditemukan.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
      summary: Mengambil profil user aktif
      tags:
        - User
    patch:
      description: Multipart parsial untuk nama, nomor HP, email, tanggal lahir YYYY-MM-DD (bukan masa depan), gender_id referensi, alamat pribadi maksimal 1000 karakter, dan avatar PNG/JPEG maksimal 3 MiB, 4096 px per sisi/16 MP. Omit mempertahankan nilai; string kosong menghapus field opsional. Username, role serta outlet read-only.
      operationId: update-current-user
      requestBody:
        content:
          multipart/form-data:
            encoding:
              avatar:
                contentType: image/png,image/jpeg
              date_of_birth:
                contentType: text/plain
              email:
                contentType: text/plain
              first_name:
                contentType: text/plain
              gender_id:
                contentType: text/plain
              last_name:
                contentType: text/plain
              personal_address:
                contentType: text/plain
              phone_number:
                contentType: text/plain
              remove_avatar:
                contentType: text/plain
            schema:
              properties:
                avatar:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
                date_of_birth:
                  type: string
                email:
                  maxLength: 254
                  type: string
                first_name:
                  maxLength: 100
                  type: string
                gender_id:
                  type: string
                last_name:
                  maxLength: 100
                  type: string
                personal_address:
                  maxLength: 1000
                  type: string
                phone_number:
                  maxLength: 30
                  minLength: 8
                  type: string
                remove_avatar:
                  type: boolean
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Data tidak ditemukan.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi konflik data.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Ukuran payload terlalu besar.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Layanan eksternal bermasalah.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Layanan sementara tidak tersedia.
