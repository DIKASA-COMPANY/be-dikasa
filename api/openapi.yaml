info:
  title: API Dikasa
  version: 1.0.0
openapi: 3.1.0
paths:
  /cash-sessions:
    get:
      operationId: list-cash-sessions
      parameters:
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            maximum: 1000000
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: page_size
          schema:
            default: 20
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashSessionsOutputBody"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Akses ditolak.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
      summary: Riwayat sesi kas outlet
      tags:
        - Sesi Kas
    post:
      description: Mencatat kas awal Rupiah untuk membuka satu sesi kas pada outlet user. Hanya satu sesi boleh aktif per outlet.
      operationId: open-cash-session
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Akses ditolak.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi konflik data.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
      summary: Membuka sesi kas
      tags:
        - Sesi Kas
  /cash-sessions/current:
    get:
      description: Mengambil sesi kas yang sedang aktif pada outlet user terautentikasi.
      operationId: get-current-cash-session
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Akses ditolak.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Data tidak ditemukan.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
      summary: Mengambil sesi kas aktif
      tags:
        - Sesi Kas
  /cash-sessions/{session_id}:
    get:
      operationId: get-cash-session
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashDetailOutputBody"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Akses ditolak.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Data tidak ditemukan.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
      summary: Ringkasan sesi kas
      tags:
        - Sesi Kas
  /cash-sessions/{session_id}/activity:
    get:
      description: Total penuh sesi, halaman event terpisah. Kas awal + penjualan tunai - refund tunai + kas masuk - kas keluar. Sesi tertutup memakai ringkasan tersimpan.
      operationId: cash-activity
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            maximum: 1000000
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: page_size
          schema:
            default: 20
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Akses ditolak.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Data tidak ditemukan.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi konflik data.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Ukuran payload terlalu besar.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Layanan eksternal bermasalah.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Layanan sementara tidak tersedia.
      summary: Aktivitas tunai satu sesi
      tags:
        - Kas Kasir
  /cash-sessions/{session_id}/close:
    post:
      description: Kasir pembuka atau manager outlet. Wajib request UUID dan preview hash. Permintaan identik mengembalikan hasil awal; pratinjau usang atau UUID berbeda untuk sesi tertutup ditolak. Tidak menghapus keranjang atau membuka sesi berikutnya.
      operationId: close-cash-session
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseCommand"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashCloseOutputBody"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Akses ditolak.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Data tidak ditemukan.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi konflik data.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
      summary: Tutup sesi kas
      tags:
        - Sesi Kas
  /cash-sessions/{session_id}/close/preview:
    post:
      description: Kasir pembuka atau manager outlet. Kas awal + tunai diterima setelah kembalian - refund tunai pada sesi ini. Alasan wajib bila selisih bukan nol.
      operationId: preview-close-cash-session
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseSelection"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashPreviewOutputBody"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Akses ditolak.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Data tidak ditemukan.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi konflik data.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi kesalahan pada server.
      summary: Pratinjau hitungan kas
      tags:
        - Sesi Kas
  /cash-sessions/{session_id}/movements:
    post:
      description: "Kasir pembuka atau manager. UUID terikat aktor/sesi/body/foto; replay identik tidak menambah entri. Bukti PNG/JPEG opsional <=3 MiB. Pengeluaran tidak boleh melebihi kas diharapkan. Respons hilang: pulihkan atau kirim ulang intent asli, jangan UUID baru."
      operationId: create-cash-movement
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              amount:
                contentType: text/plain
              kind:
                contentType: text/plain
              name:
                contentType: text/plain
              proof:
                contentType: image/png,image/jpeg
              reason:
                contentType: text/plain
              request_id:
                contentType: text/plain
            schema:
              properties:
                amount:
                  format: int64
                  maximum: 9007199254740991
                  minimum: 1
                  type: integer
                kind:
                  enum:
                    - in
                    - out
                  type: string
                name:
                  maxLength: 120
                  minLength: 1
                  type: string
                proof:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
                reason:
                  maxLength: 500
                  minLength: 1
                  type: string
                request_id:
                  format: uuid
                  type: string
              required:
                - request_id
                - kind
                - name
                - amount
                - reason
              type: object
      responses:
        "201":
