  /users/me:
    get:
      description: Mengambil profil PostgreSQL berdasarkan identitas Firebase ID token.
      operationId: get-current-user
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "404":
