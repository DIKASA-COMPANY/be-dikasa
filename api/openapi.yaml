        id:
          format: uuid
          type: string
        is_active:
          type: boolean
        name:
          type: string
        sort_order:
          format: int64
          type: integer
      required:
        - id
        - name
        - capacity
        - sort_order
        - is_active
      type: object
    TableOutputBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/TableData"
      required:
        - data
      type: object
    TableRequest:
      additionalProperties: false
      properties:
        capacity:
          format: int64
          type: integer
        is_active:
          type: boolean
        name:
          type: string
        sort_order:
          format: int64
          type: integer
      required:
        - name
        - capacity
        - sort_order
