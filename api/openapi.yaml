      description: Khusus manager. Multipart parsial dapat mengganti daftar variations, mengganti image, atau menghapus image dengan remove_image.
      operationId: update-product
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              category_id:
                contentType: text/plain
              cost_price:
                contentType: text/plain
              description:
                contentType: text/plain
              image:
                contentType: image/png,image/jpeg
              is_active:
                contentType: text/plain
              is_highlighted:
                contentType: text/plain
              name:
                contentType: text/plain
              online_cost_price:
                contentType: text/plain
              online_selling_price:
                contentType: text/plain
              product_type:
                contentType: text/plain
              remove_image:
                contentType: text/plain
              selling_price:
                contentType: text/plain
              sort_order:
                contentType: text/plain
              stock_status:
                contentType: text/plain
              variations:
                contentType: application/json
            schema:
              properties:
                category_id:
                  format: uuid
                  type: string
                cost_price:
                  format: int64
                  minimum: 0
                  type: integer
                description:
                  type: string
                image:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
                is_active:
                  type: boolean
                is_highlighted:
                  type: boolean
                name:
                  maxLength: 150
                  type: string
                online_cost_price:
                  format: int64
                  minimum: 0
                  type: integer
                online_selling_price:
                  format: int64
                  minimum: 0
                  type: integer
                product_type:
                  enum:
                    - food
                    - drink
                    - additional
                  type: string
                remove_image:
                  type: boolean
                selling_price:
                  format: int64
                  minimum: 0
                  type: integer
                sort_order:
                  format: int64
                  type: integer
                stock_status:
                  enum:
                    - available
                    - out_of_stock
                  type: string
                variations:
                  items:
                    $ref: "#/components/schemas/ProductVariantRequest"
                  type:
                    - array
                    - "null"
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOutputBody"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Autentikasi diperlukan.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Akses ditolak.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Data tidak ditemukan.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Terjadi konflik data.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Ukuran payload terlalu besar.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusError"
          description: Validasi data gagal.
        "500":
          content:
            application/json:
              schema:
