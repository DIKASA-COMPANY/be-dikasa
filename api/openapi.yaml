    ReservationRequest:
      additionalProperties: false
      properties:
        customer_contact:
          type: string
        customer_name:
          type: string
        notes:
          maxLength: 1000
          type: string
        print_reservation:
          type: boolean
        reservation_type_id:
          format: uuid
          type: string
        reserved_at:
          format: date-time
          type: string
        restaurant_table_id:
          format: uuid
          type: string
        send_reservation:
          type: boolean
      required:
        - customer_name
        - customer_contact
        - reservation_type_id
        - restaurant_table_id
        - reserved_at
        - notes
        - print_reservation
        - send_reservation
      type: object
    ReservationsOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/ReservationData"
          type:
            - array
            - "null"
        meta:
          $ref: "#/components/schemas/MetaStruct"
      required:
        - data
        - meta
      type: object
    SessionData:
      additionalProperties: false
      properties:
        closed_at:
          format: date-time
          type: string
        closing_cash:
          examples:
            - 750000
          format: int64
          type: integer
        id:
          format: uuid
          type: string
        opened_at:
          format: date-time
          type: string
        opening_cash:
          examples:
            - 500000
          format: int64
          type: integer
        outlet_id:
          format: uuid
          type: string
        status:
          enum:
            - open
            - closed
          examples:
            - open
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - id
        - outlet_id
        - user_id
        - opening_cash
        - status
        - opened_at
      type: object
    SessionResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/SessionData"
      required:
        - data
      type: object
    StatusError:
